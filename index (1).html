<style>
/* Layout: phone-first streaming home. Billboard hero with tonight's pick, filter pills, one horizontal
   poster row per person (first card is "adicionar"), watched history last. The draw button lives in a
   fixed bottom dock within thumb reach; tapping a poster opens a bottom sheet with its actions.
   Single committed look: near-black ground, one red, white type. */
:root {
  color-scheme: dark;
  --bg: #141414;
  --surface: #1F1F1F;
  --ink: #FFFFFF;
  --muted: #B3B3B3;
  --line: #3A3A3A;
  --red: #E50914;
  --red-hover: #F6121D;
  --gray-btn: rgba(109, 109, 110, 0.7);
  --danger: #FF8A80;
  --focus: #FFFFFF;
  --font-display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 14px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 20px; }
.wrap > * { min-width: 0; }
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.contents { display: contents; }

.nav { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.brand {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 2.6rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--red);
  margin: 0;
  line-height: 1;
}
.nav p { margin: 0; color: var(--muted); font-size: 14px; }

.banner { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 6px; color: var(--muted); }

/* ---- Hero ---- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  min-height: 240px;
  padding: 36px 20px 24px;
  display: grid;
  align-content: end;
  gap: 12px;
  scroll-margin-top: 8px;
  background:
    radial-gradient(90% 130% at 88% -10%, rgba(229, 9, 20, 0.5), transparent 60%),
    linear-gradient(100deg, #000000 0%, #1B1B1B 100%);
}
.hero > * { position: relative; z-index: 1; }
.label { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.label b { color: var(--red); font-weight: 600; }
.t-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(3rem, 12vw, 6.5rem);
  line-height: 0.9;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
  max-width: 16ch;
  text-wrap: balance;
  overflow-wrap: anywhere;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
}
.t-title.is-empty { color: #7A7A7A; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: 15px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.hero-actions button { flex: 1 1 160px; }
.btn-white, .btn-gray {
  border: 0;
  border-radius: 6px;
  padding: 12px 22px;
  min-height: 48px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-white { background: #FFFFFF; color: #000000; }
.btn-white:hover:not([disabled]) { background: rgba(255, 255, 255, 0.8); }
.btn-gray { background: var(--gray-btn); color: #FFFFFF; }
.btn-gray:hover:not([disabled]) { background: rgba(109, 109, 110, 0.45); }
.btn-gray.danger { color: var(--danger); }
button[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---- Filters ---- */
.filters { display: grid; gap: 14px; }
.field-label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-btn, .seg-label span {
  display: flex;
  align-items: center;
  min-height: 42px;
  border: 1px solid #4D4D4D;
  background: transparent;
  color: var(--ink);
  border-radius: 999px;
  padding: 8px 18px;
  cursor: pointer;
  font-weight: 500;
  line-height: 1.2;
}
.seg-btn[aria-pressed="true"], .seg-label input:checked + span { background: #FFFFFF; color: #000000; border-color: #FFFFFF; }
.seg-label { display: block; }
.seg-label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg-label input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.tap-hint { margin: 0; color: var(--muted); font-size: 14px; }
.status { min-height: 1.4em; margin: -8px 0 0; color: var(--muted); }

/* ---- Bottom dock ---- */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  pointer-events: none;
  padding-top: 30px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
.dock-in { max-width: 1180px; margin-inline: auto; display: flex; align-items: center; gap: 14px; pointer-events: auto; }
.btn-draw {
  flex: 1;
  min-height: 54px;
  background: var(--red);
  color: #FFFFFF;
  border: 0;
  border-radius: 6px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.9rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 20px 6px;
  cursor: pointer;
}
.btn-draw:hover:not([disabled]) { background: var(--red-hover); }
.count { flex: none; font-size: 14px; color: var(--muted); margin: 0; text-align: right; max-width: 6.5em; line-height: 1.25; }

/* ---- Rows ---- */
.rowsec { display: grid; gap: 10px; }
.row-head { display: flex; align-items: center; gap: 10px; }
.row-head h2 { font-size: 1.3rem; font-weight: 600; margin: 0; }
.row-head .n { color: var(--muted); font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.row-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 4px 14px 2px;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}
.card {
  position: relative;
  flex: none;
  width: clamp(132px, 38vw, 172px);
  aspect-ratio: 2 / 3;
  border-radius: 6px;
  overflow: hidden;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-snap-align: start;
  cursor: pointer;
  background: linear-gradient(165deg, hsl(var(--h, 0) 55% 30%), hsl(var(--h, 0) 60% 11%));
}
.card:active { filter: brightness(1.2); }
.card.has-cover { background-size: cover; background-position: center; justify-content: space-between; }
.card.has-cover .card-title { font-size: 1.05rem; line-height: 1; text-shadow: 0 1px 6px #000; }
.card.has-cover::after { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); pointer-events: none; }
.card.has-cover > * { position: relative; z-index: 1; }
a.big { display: flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; }
.card.is-pick { outline: 3px solid var(--red); outline-offset: -3px; }
.card.is-watched { filter: grayscale(0.7); opacity: 0.8; }
.card-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.7rem;
  line-height: 0.95;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
  margin: 0;
}
.card-note { font-size: 12.5px; color: rgba(255, 255, 255, 0.75); overflow-wrap: anywhere; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.add-card {
  background: var(--surface);
  border: 2px dashed #5A5A5A;
  color: var(--muted);
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 600;
}
.add-card:active { filter: none; border-color: #FFFFFF; color: #FFFFFF; }
.add-card[disabled] { opacity: 0.5; cursor: not-allowed; }
.add-card .plus { font-family: var(--font-display); font-size: 3.4rem; line-height: 1; color: var(--red); }
.empty { flex: 1 1 240px; min-width: 220px; align-self: center; color: var(--muted); padding: 12px; }
@media (hover: hover) {
  .card { transition: transform 0.15s ease; }
  .card:hover { transform: scale(1.04); z-index: 2; }
  .add-card:hover:not([disabled]) { color: #FFFFFF; border-color: #FFFFFF; transform: none; }
}

.tag {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  color: rgba(255, 255, 255, 0.85);
  white-space: nowrap;
}
.tag.first { background: var(--red); border-color: var(--red); color: #FFFFFF; }
.tag.live { background: #FFFFFF; border-color: #FFFFFF; color: #000000; }
.tag.rt { letter-spacing: 0.04em; }
.tag.v-liked { background: #FFFFFF; border-color: #FFFFFF; color: #000000; }
.tag.v-disliked { border-color: var(--danger); color: var(--danger); background: rgba(0, 0, 0, 0.35); }
.tag.v-none { border-style: dashed; }

/* ---- Add panel ---- */
.add { background: var(--surface); border-radius: 6px; padding: 16px; display: grid; gap: 10px; max-width: 560px; }
.add fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; min-width: 0; }
.add fieldset[disabled] { opacity: 0.55; }
.add-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.add-row .btn-white, .add-row .btn-gray { flex: 1 1 140px; }
.input { width: 100%; min-height: 48px; font-size: 16px; background: #333333; border: 1px solid #4D4D4D; border-radius: 6px; padding: 10px 12px; min-width: 0; color: #FFFFFF; }
.input::placeholder { color: #8C8C8C; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }

.history summary { cursor: pointer; font-size: 1.3rem; font-weight: 600; padding-block: 8px; }
.history .count { display: inline; font-weight: 400; max-width: none; }

/* ---- Bottom sheet ---- */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 20; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 21;
  max-width: 560px;
  margin-inline: auto;
  max-height: 88vh;
  overflow-y: auto;
  display: grid;
  gap: 12px;
  background: var(--surface);
  border-radius: 14px 14px 0 0;
  padding-top: 10px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.grip { width: 40px; height: 4px; border-radius: 2px; background: #555; margin: 2px auto 4px; }
.sheet h3 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 2.6rem;
  line-height: 0.95;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
  overflow-wrap: anywhere;
}
.sheet-sub { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.sheet-actions { display: grid; gap: 10px; }
.big { width: 100%; }
.stars { display: flex; gap: 6px; }
.star {
  flex: 1;

  border-radius: 6px;
  border: 1px solid #4D4D4D;

        var W = 260, H = 390, r = img.width / img.height, tr = W / H;
        var sw = img.width, sh = img.height, sx = 0, sy = 0;
        if (r > tr) { sw = img.height * tr; sx = (img.width - sw) / 2; } else { sh = img.width / tr; sy = (img.height - sh) / 2; }
        var c = document.createElement("canvas"); c.width = W; c.height = H;
        c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.78));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }
  async function setCover(m, dataUrl) {
    try {
      await state.db.doc("movies/" + m.id).update({ cover: dataUrl });
      say(dataUrl ? "Capa salva: " + m.title + "." : "Capa removida.");
    } catch (e) { onWriteError(e, false); }
  }
  $("coverFile").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    var m = coverTarget;
    ev.target.value = "";
    if (!f || !m) return;
    resizeToDataUrl(f).then(function (d) { return setCover(m, d); }).catch(function () { say("Não consegui ler essa imagem."); });
  });
  function coverActs(m, act) {
    var out = [];
    out.push(act(m.cover ? "Trocar capa" : "Adicionar capa", "btn-gray", function () {
      coverTarget = m; closeSheet(); $("coverFile").click();
    }));
    out.push(h("a", { class: "btn-gray big", href: "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(m.title + " filme pôster"), target: "_blank", rel: "noopener", text: "Buscar capa na internet" }));
    if (m.cover) out.push(act("Remover capa", "btn-gray danger", function () { closeSheet(); setCover(m, null); }));
    return out;
  }

  function card(m, opts) {
    var isPick = !opts.watched && state.tonight && state.tonight.movieId === m.id;
    var sub = [];
    if (opts.watched && m.watchedAt) sub.push("visto em " + new Date(m.watchedAt).toLocaleDateString("pt-BR"));
    if (!opts.watched && m.lastWatchedAt) sub.push("já vimos em " + new Date(m.lastWatchedAt).toLocaleDateString("pt-BR") + (hasRating(m) ? " · " + starsText(m.rating) : ""));
    if (m.note) sub.push(m.note);
    if (opts.showOwner) sub.push("de " + ownerOf(m));
    var open = function () { openSheet(m, opts); };
    var el = h("div", {
      class: "card" + (isPick ? " is-pick" : "") + (opts.watched ? " is-watched" : ""),
      role: "button", tabindex: "0", "aria-label": m.title,
      onclick: open,
      onkeydown: function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } }
    },
      h("div", { class: "card-tags" }, tag(m.kind), opts.watched ? ratingTag(m) : null, isPick ? h("span", { class: "tag live", text: "Em cartaz" }) : null),
      h("p", { class: "card-title", text: m.title }),
      sub.length ? h("div", { class: "card-note", text: sub.join(" · ") }) : null);
    el.style.setProperty("--h", String(hueOf(m.title)));
    if (m.cover && /^(data:image\/|https:\/\/)/.test(m.cover)) {
      el.classList.add("has-cover");
      el.style.backgroundImage = "url(\"" + m.cover + "\")";
    }
    return el;
  }

  function fillRow(box, items, emptyMsg, opts) {
    var rows = items.length ? items.map(function (m) { return card(m, opts); })
      : [h("div", { class: "empty", text: state.loaded ? emptyMsg : "Carregando…" })];
    box.replaceChildren.apply(box, rows);
  }

  function renderLists() {
    var pending = state.movies.filter(function (m) { return !m.watched; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    var mine = pending.filter(isMine);
    var others = pending.filter(function (m) { return !isMine(m); });
    var on = otherName();

    $("meCount").textContent = mine.length;
    $("otherCount").textContent = others.length;
    $("meTitle").textContent = "Lista " + de(names().me);
    $("otherTitle").textContent = "Lista " + de(on);
    $("meDot").style.background = colorFor(true);
    $("otherDot").style.background = colorFor(false);

    fillRow($("listMe"), mine, "Sua lista está vazia. Use o primeiro cartão para adicionar um filme.", { showOwner: false });
    fillRow($("listOther"), others, "Ainda não há filmes aqui. Quando " + on + " abrir esta página e adicionar os dela, a lista aparece neste lugar.", { showOwner: false });

    var watched = state.movies.filter(function (m) { return m.watched; })
      .sort(function (a, b) { return (b.watchedAt || 0) - (a.watchedAt || 0); });
    $("hCount").textContent = watched.length ? "(" + watched.length + ")" : "";
    fillRow($("hList"), watched, "Os filmes marcados como vistos aparecem aqui.", { watched: true, showOwner: true });
    $("whoBox").hidden = !(state.ready && state.myId && !state.meName);
  }

  function renderForm() {
    $("addSet").disabled = !canAdd();
    $("btnAdd").disabled = !canAdd();
    var hint = $("formHint");
    var msg = "";
    if (state.ready && !state.myId) msg = "Entre na sua conta para adicionar filmes.";
    else if (state.ready && !state.canWrite) msg = "Você só tem permissão de leitura nesta página. Peça acesso de edição para adicionar filmes.";
    hint.textContent = msg;
    hint.hidden = !msg;
  }

  function withTimeout(p, ms, fallback) {
    return new Promise(function (resolve) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(fallback); } }, ms);
      Promise.resolve(p).then(
        function (v) { if (!done) { done = true; clearTimeout(t); resolve(v); } },
        function () { if (!done) { done = true; clearTimeout(t); resolve(fallback); } });
    });
  }
  var profKey = "";
  function paint() {
    try { renderTicket(); } catch (e) { console.error(e); }
    try { renderControls(); } catch (e) { console.error(e); }
    try { renderLists(); } catch (e) { console.error(e); }
    try { renderForm(); } catch (e) { console.error(e); }
  }
  function refreshProfiles() {
    if (!state.user) return;
    var ids = [];
    state.movies.forEach(function (m) { if (m.ownerId && ids.indexOf(m.ownerId) < 0) ids.push(m.ownerId); });
    if (state.myId && ids.indexOf(state.myId) < 0) ids.push(state.myId);
    var key = ids.slice().sort().join(",");
    if (!ids.length || key === profKey) return;
    profKey = key;
    withTimeout(state.user.profiles(ids), 4000, null).then(function (p) { if (p) { state.profiles = p; paint(); } });
  }
  function render() { paint(); refreshProfiles(); }

  /* ---------- events ---------- */
  document.querySelectorAll(".seg-btn").forEach(function (b) {
    b.addEventListener("click", function () { state[b.dataset.key] = b.dataset.val; renderControls(); });
  });
  $("btnDraw").addEventListener("click", draw);
  $("btnWatched").addEventListener("click", function () { var m = currentPick(); if (m) openRating(m); });
  $("btnClear").addEventListener("click", clearTonight);
  $("backdrop").addEventListener("click", closeSheet);
  $("shClose").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  document.querySelectorAll("[data-who]").forEach(function (b) {
    b.addEventListener("click", async function () {
      state.meName = b.dataset.who;
      render();
      try { await state.db.doc("data/users/" + state.myId + "/profile").set({ name: state.meName }); } catch (e) { /* kept in memory only */ }
    });
  });

  function setAddOpen(open) {
    $("addForm").hidden = !open;
    $("btnAdd").setAttribute("aria-expanded", String(open));
    if (open) $("fTitle").focus(); else $("btnAdd").focus();
  }
  $("btnAdd").addEventListener("click", function () { setAddOpen($("addForm").hidden); });
  $("btnCloseAdd").addEventListener("click", function () { setAddOpen(false); });

  var adding = false;
  $("addForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (adding || !canAdd()) return;
    var title = $("fTitle").value.trim().replace(/\s+/g, " ");
    if (!title) { $("fTitle").focus(); return; }
    var dup = state.movies.some(function (m) { return !m.watched && isMine(m) && m.title.toLowerCase() === title.toLowerCase(); });
    if (dup) { say("Esse filme já está na sua lista."); return; }
    var kind = document.querySelector('input[name="kind"]:checked').value;
    adding = true;
    try {
      await state.db.collection("movies").add({
        title: title, kind: kind, note: $("fNote").value.trim(), ownerId: state.myId, ownerName: meName(),
        watched: false, createdAt: Date.now()
      });
      $("fTitle").value = ""; $("fNote").value = "";
      $("fTitle").focus();
      say("Adicionado: " + title);
    } catch (e) { onWriteError(e, true); }
    adding = false;
  });

  /* ---------- start ---------- */
  $("tDate").textContent = fmtDate(new Date());
  render();

  (async function init() {
    var cl = window.__metflixShim || window.claude;
    if (!cl || !cl.use) { banner("Não foi possível conectar ao banco de dados. Confira a configuração no início do arquivo."); return; }
    var db = null, user = null;
    try { db = await cl.use("db"); } catch (e) { db = null; }
    try { user = await cl.use("user"); } catch (e) { user = null; }
    state.db = db; state.user = user;
    if (!db) {
      banner("Não foi possível conectar ao banco de dados. Confira a configuração no início do arquivo. Aqui ela fica em modo leitura.");
      state.loaded = true;
      render();
      return;
    }
    state.ready = true;
    function dbErr() { banner("A conexão com as listas foi encerrada. Recarregue a página."); }
    db.collection("movies").onSnapshot(function (snap) {
      state.movies = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function (m) { return typeof m.title === "string"; });
      state.loaded = true;
      render();
    }, dbErr);
    db.doc("state/tonight").onSnapshot(function (s) {
      state.tonight = s.exists ? s.data() : null;
      render();
    }, dbErr);
    render();

    var uid = null, who = null;
    if (user) {
      uid = await withTimeout(user.id(), 4000, null);
      var cw = await withTimeout(user.can("data.write"), 4000, null);
      state.canWrite = cw !== false;
    }
    if (uid) {
      var pd = await withTimeout(db.doc("data/users/" + uid + "/profile").get(), 4000, null);
      if (pd && pd.exists) {
        var pn = pd.data() && pd.data().name;
        if (pn === "Gabriela" || pn === "Guilherme") who = pn;
      }
      if (!who) {
        var pr = await withTimeout(user.profiles([uid]), 4000, null);
        if (pr) {
          state.profiles = pr;
          var p0 = pr[uid];
          var f0 = p0 && p0.name ? firstName(p0.name).toLowerCase() : "";
          if (f0 === "gabriela") who = "Gabriela";
          else if (f0 === "guilherme" || f0 === "gui") who = "Guilherme";
        }
      }
    }
    state.myId = uid;
    state.meName = who;
    render();
  })();
})();
</script>
